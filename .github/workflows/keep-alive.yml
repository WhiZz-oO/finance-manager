name: Keep Render Backend Awake

on:
  schedule:
    # Runs every 12 minutes to prevent Render free tier from sleeping (sleep threshold is 15 mins)
    - cron: '*/12 * * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend Health Endpoint
        run: |
          echo "Pinging Render backend at $(date)..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://finance-manager-ee9y.onrender.com/health")
          echo "Response code: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "✅ Server is alive and awake!"
          else
            echo "⚠️ Server woke up or returned status: $HTTP_STATUS"
          fi
